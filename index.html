<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#171310">
<title>Navaja — Asistente de Barbería</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#171310;
  --surface:#211c18;
  --surface-2:#2b241f;
  --line:#3a322b;
  --ink:#f3ece1;
  --ink-dim:#b5a99a;
  --gold:#c89b3c;
  --gold-dim:#8a7130;
  --red:#a1443c;
  --blue:#3c5e73;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Work Sans', sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(200,155,60,0.08), transparent 60%),
    var(--bg);
}

/* ---------- header ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 20px 14px;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
}
.brand .mark{
  font-family:'Anton', sans-serif;
  font-size:28px;
  letter-spacing:0.5px;
  color:var(--ink);
}
.brand .mark span{color:var(--gold);}
.brand .sub{
  font-size:12px;
  color:var(--ink-dim);
}
.pole{
  width:10px;
  height:34px;
  border-radius:6px;
  background:repeating-linear-gradient(45deg,
    var(--red) 0 6px,
    #ece3d2 6px 12px,
    var(--blue) 12px 18px);
  box-shadow: inset 0 0 4px rgba(0,0,0,.4);
}

/* ---------- content ---------- */
.content{
  flex:1;
  padding:6px 20px 110px;
  overflow-y:auto;
}
h2.section-title{
  font-family:'Anton', sans-serif;
  font-weight:400;
  font-size:22px;
  letter-spacing:0.3px;
  margin:18px 0 12px;
  color:var(--ink);
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}
.muted{color:var(--ink-dim);}
.small{font-size:13px;}

/* ---------- assistant tab ---------- */
.assist-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:10px;
}
.mic-zone{
  position:relative;
  width:190px;
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:14px 0 10px;
}
.mic-ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:conic-gradient(var(--red) 0 12.5%, #ece3d2 12.5% 25%, var(--blue) 25% 37.5%, #ece3d2 37.5% 50%, var(--red) 50% 62.5%, #ece3d2 62.5% 75%, var(--blue) 75% 87.5%, #ece3d2 87.5% 100%);
  opacity:0;
  transition:opacity .25s ease;
}
.mic-ring.spin{
  opacity:1;
  animation:spin 3s linear infinite;
}
@keyframes spin{ to { transform:rotate(360deg); } }
.mic-btn{
  position:relative;
  z-index:2;
  width:150px;
  height:150px;
  border-radius:50%;
  border:none;
  background:radial-gradient(circle at 35% 30%, #dcb457, var(--gold) 55%, var(--gold-dim) 100%);
  color:#211c18;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform .15s ease;
}
.mic-btn:active{transform:scale(0.96);}
.mic-btn svg{width:52px;height:52px;}
.status-text{
  margin-top:6px;
  font-size:14px;
  color:var(--ink-dim);
  min-height:20px;
  text-align:center;
}
.chatlog{
  width:100%;
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.bubble{
  max-width:85%;
  padding:10px 14px;
  border-radius:14px;
  font-size:14.5px;
  line-height:1.4;
}
.bubble.user{
  align-self:flex-end;
  background:var(--gold);
  color:#1c1712;
  border-bottom-right-radius:4px;
}
.bubble.assistant{
  align-self:flex-start;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-bottom-left-radius:4px;
}
.text-fallback{
  display:flex;
  gap:8px;
  width:100%;
  margin-top:16px;
}
.text-fallback input{
  flex:1;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 12px;
  color:var(--ink);
  font-family:inherit;
  font-size:14px;
}
.text-fallback input::placeholder{color:var(--ink-dim);}
.text-fallback button{
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:10px;
  padding:0 16px;
  font-family:inherit;
  cursor:pointer;
}

/* ---------- lists ---------- */
.list-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}
.list-item:last-child{border-bottom:none;}
.li-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
.li-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.li-sub{font-size:12.5px;color:var(--ink-dim);}
.li-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.tag{
  font-size:11px;
  padding:3px 8px;
  border-radius:20px;
  border:1px solid var(--line);
  color:var(--ink-dim);
}
.tag.done{color:var(--gold);border-color:var(--gold-dim);}
.tag.cancel{color:var(--red);border-color:var(--red);}
.amount{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;}
.amount.income{color:#c9d98a;}
.amount.expense{color:var(--red);}
.icon-btn{
  background:none;
  border:none;
  color:var(--ink-dim);
  cursor:pointer;
  padding:4px;
  font-size:16px;
  line-height:1;
}

/* ---------- balance card ---------- */
.balance-card{
  background:linear-gradient(135deg, var(--surface-2), var(--surface));
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
}
.balance-label{font-size:13px;color:var(--ink-dim);}
.balance-value{
  font-family:'Anton', sans-serif;
  font-size:36px;
  color:var(--gold);
  margin-top:4px;
}
.balance-row{display:flex;gap:20px;margin-top:14px;}
.balance-mini{font-size:13px;}
.balance-mini b{display:block;font-size:16px;margin-top:2px;}

/* ---------- fab + tabbar ---------- */
.fab{
  position:fixed;
  bottom:96px;
  right:calc(50% - 240px + 20px);
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--gold);
  color:#201a13;
  border:none;
  font-size:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:var(--shadow);
  z-index:20;
}
@media (max-width:480px){
  .fab{right:20px;}
}
.tabbar{
  position:fixed;
  bottom:0;
  left:0;right:0;
  max-width:480px;
  margin:0 auto;
  background:rgba(23,19,16,0.92);
  backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  display:flex;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  z-index:15;
}
.tab-btn{
  flex:1;
  background:none;
  border:none;
  color:var(--ink-dim);
  font-family:inherit;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:6px 0;
  cursor:pointer;
}
.tab-btn svg{width:22px;height:22px;}
.tab-btn.active{color:var(--gold);}

/* ---------- modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.55);
  display:flex;
  align-items:flex-end;
  z-index:50;
}
.modal-backdrop.hidden{display:none;}
.modal{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px 18px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  width:100%;
  max-width:480px;
  margin:0 auto;
  max-height:85vh;
  overflow-y:auto;
}
.modal h3{
  font-family:'Anton', sans-serif;
  font-weight:400;
  font-size:20px;
  margin:0 0 14px;
}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  color:var(--ink);
  font-family:inherit;
  font-size:14.5px;
}
.seg{
  display:flex;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}
.seg button{
  flex:1;
  padding:10px;
  background:var(--surface-2);
  border:none;
  color:var(--ink-dim);
  font-family:inherit;
  cursor:pointer;
}
.seg button.active{background:var(--gold);color:#211c18;font-weight:600;}
.modal-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}
.btn{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  font-family:inherit;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
}
.btn.primary{background:var(--gold);color:#211c18;}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
.empty{
  text-align:center;
  padding:40px 10px;
  color:var(--ink-dim);
}
.empty .big{font-size:34px;margin-bottom:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== HELPERS ===================== */
const $ = (s,el=document) => el.querySelector(s);
const $$ = (s,el=document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtMoney = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const fmtDateLabel = iso => {
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return new Intl.DateTimeFormat('es-CO',{weekday:'short',day:'numeric',month:'short'}).format(d);
};

/* ===================== STORAGE (localStorage: funciona en cualquier navegador) ===================== */
async function loadKey(key, fallback){
  try{
    const raw = localStorage.getItem('navaja_'+key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function saveKey(key, value){
  try{ localStorage.setItem('navaja_'+key, JSON.stringify(value)); }catch(e){ console.error('storage error', e); }
}
function getApiKey(){ return localStorage.getItem('navaja_api_key') || ''; }
function setApiKey(v){ localStorage.setItem('navaja_api_key', v || ''); }

const DEFAULT_SERVICES = [
  {id:uid(), name:'Corte clásico', price:25000, duration:30},
  {id:uid(), name:'Corte + barba', price:35000, duration:45},
  {id:uid(), name:'Afeitado', price:20000, duration:25},
  {id:uid(), name:'Diseño / línea', price:15000, duration:15},
];

/* ===================== STATE ===================== */
const state = {
  tab: 'asistente',
  appointments: [],
  transactions: [],
  services: [],
  chat: [{role:'assistant', text:'Hola, soy Navaja. Puedes decirme cosas como "agenda un corte para Juan mañana a las 3" o "registra un ingreso de 25 mil por un corte".'}],
  listening: false,
  modal: null, // {type:'appointment'|'transaction'|'service', data:{...}}
};

async function bootstrap(){
  state.appointments = await loadKey('appointments', []);
  state.transactions = await loadKey('transactions', []);
  state.services = await loadKey('services', null);
  if(!state.services){
    state.services = DEFAULT_SERVICES;
    await saveKey('services', state.services);
  }
  render();
}

/* ===================== VOICE: STT ===================== */
let recognition = null;
function getRecognition(){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Ctor) return null;
  if(recognition) return recognition;
  recognition = new Ctor();
  recognition.lang = 'es-CO';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onstart = () => { state.listening = true; render(); };
  recognition.onend = () => { state.listening = false; render(); };
  recognition.onerror = () => { state.listening = false; render(); };
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    askAssistant(text);
  };
  return recognition;
}
function toggleMic(){
  const rec = getRecognition();
  if(!rec){
    addChat('assistant', 'Tu navegador no soporta reconocimiento de voz. Puedes escribir tu solicitud abajo.');
    render();
    return;
  }
  if(state.listening){ rec.stop(); }
  else { rec.start(); }
}

/* ===================== VOICE: TTS ===================== */
function speak(text){
  if(!text) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-CO';
    u.rate = 1.02;
    const voices = window.speechSynthesis.getVoices();
    const esVoice = voices.find(v=>v.lang && v.lang.startsWith('es'));
    if(esVoice) u.voice = esVoice;
    window.speechSynthesis.speak(u);
  }catch(e){ console.error(e); }
}

/* ===================== CHAT ===================== */
function addChat(role, text){
  state.chat.push({role, text});
  if(state.chat.length > 40) state.chat.shift();
}

/* ===================== ASSISTANT / IA ===================== */
function computeBalance(txs){
  return txs.reduce((acc,t)=> acc + (t.type==='income'? t.amount : -t.amount), 0);
}

function buildSystemPrompt(){
  const svc = state.services.map(s=>`${s.name} — ${fmtMoney(s.price)} (${s.duration} min)`).join('; ') || 'ninguno configurado';
  const upcoming = state.appointments
    .filter(a=>a.status!=='cancelada' && a.date >= todayISO())
    .sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time))
    .slice(0,25)
    .map(a=>`[${a.id}] ${a.date} ${a.time} - ${a.client} (${a.service}) estado:${a.status}`)
    .join('\n') || 'no hay citas próximas';
  const balance = computeBalance(state.transactions);

  return `Eres "Navaja", el asistente de voz de una barbería. Tu trabajo es interpretar lo que dice el barbero (en español, transcrito por voz, puede tener errores de transcripción) y devolver EXCLUSIVAMENTE un objeto JSON, sin texto adicional, sin markdown, sin backticks.

Formato exacto de salida:
{
  "action": "crear_cita" | "cancelar_cita" | "listar_citas" | "registrar_ingreso" | "registrar_gasto" | "agregar_servicio" | "consultar_balance" | "conversacion",
  "params": { ... },
  "respuesta_hablada": "frase corta, natural y hablada en español para decirle en voz alta al barbero"
}

Reglas por acción:
- crear_cita: params = { cliente, servicio, fecha (YYYY-MM-DD, resuelve "mañana", "el viernes", etc. usando la fecha de hoy), hora (HH:MM 24h), precio (número, usa el precio del servicio si no lo dicen) }
- cancelar_cita: params = { id } — busca el id más probable en la lista de citas próximas de abajo según el nombre/fecha/hora mencionados.
- listar_citas: params = { filtro_fecha } opcional (ej: fecha exacta, "hoy", "semana"). No necesitas generar la lista tú mismo en respuesta_hablada de forma exhaustiva si son muchas; resume.
- registrar_ingreso / registrar_gasto: params = { monto (número), descripcion, categoria }
- agregar_servicio: params = { nombre, precio (número), duracion (minutos, si no dicen usa 30) }
- consultar_balance: params = {}
- conversacion: usa esto si es un saludo, pregunta general o algo que no encaja en las acciones anteriores. params = {}

Siempre resuelve fechas relativas a hoy: ${todayISO()} (formato YYYY-MM-DD, zona horaria Colombia).

Servicios disponibles: ${svc}

Citas próximas (para referencia/cancelaciones):
${upcoming}

Balance actual de caja: ${fmtMoney(balance)}

Responde SIEMPRE con el JSON, nada más.`;
}

async function askAssistant(userText){
  if(!userText || !userText.trim()) return;
  const apiKey = getApiKey();
  if(!apiKey){
    addChat('user', userText);
    addChat('assistant', 'Todavía no tienes configurada tu llave de API. Ve a la pestaña Ajustes y pégala ahí — es gratis crear una cuenta y solo pagas por lo que uses.');
    render();
    return;
  }
  addChat('user', userText);
  render();
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: buildSystemPrompt(),
        messages:[{role:'user', content:userText}]
      })
    });
    if(!res.ok){
      const errText = await res.text();
      throw new Error('API error '+res.status+': '+errText);
    }
    const data = await res.json();
    const raw = (data.content||[]).map(b=>b.text||'').join('').trim();
    const clean = raw.replace(/```json|```/g,'').trim();
    const json = JSON.parse(clean);
    await handleAction(json);
  }catch(err){
    console.error(err);
    const detail = (err && err.message) ? err.message : String(err);
    const msg = 'No pude procesar esa solicitud. Detalle técnico: ' + detail;
    addChat('assistant', msg);
    speak('Hubo un problema, intenta de nuevo.');
    render();
  }
}

async function handleAction(json){
  const action = json.action;
  const p = json.params || {};
  const say = json.respuesta_hablada || 'Listo.';

  if(action === 'crear_cita'){
    state.appointments.push({
      id: uid(),
      client: p.cliente || 'Cliente',
      service: p.servicio || '',
      date: p.fecha || todayISO(),
      time: p.hora || '00:00',
      price: Number(p.precio) || 0,
      status: 'programada'
    });
    await saveKey('appointments', state.appointments);
  }
  else if(action === 'cancelar_cita'){
    const appt = state.appointments.find(a=>a.id === p.id);
    if(appt){ appt.status = 'cancelada'; await saveKey('appointments', state.appointments); }
  }
  else if(action === 'registrar_ingreso' || action === 'registrar_gasto'){
    state.transactions.push({
      id: uid(),
      type: action === 'registrar_ingreso' ? 'income' : 'expense',
      amount: Number(p.monto) || 0,
      description: p.descripcion || '',
      category: p.categoria || 'General',
      date: todayISO()
    });
    await saveKey('transactions', state.transactions);
  }
  else if(action === 'agregar_servicio'){
    state.services.push({ id: uid(), name: p.nombre || 'Servicio', price: Number(p.precio)||0, duration: Number(p.duracion)||30 });
    await saveKey('services', state.services);
  }
  // listar_citas, consultar_balance, conversacion -> no cambian datos

  addChat('assistant', say);
  speak(say);
  render();
}

/* ===================== MANUAL CRUD ===================== */
function openModal(type, data){
  state.modal = { type, data: data || {} };
  render();
}
function closeModal(){ state.modal = null; render(); }

async function submitAppointmentForm(form){
  const d = state.modal.data;
  const rec = {
    id: d.id || uid(),
    client: form.client.value.trim() || 'Cliente',
    service: form.service.value,
    date: form.date.value,
    time: form.time.value,
    price: Number(form.price.value)||0,
    status: d.status || 'programada'
  };
  if(d.id){
    const idx = state.appointments.findIndex(a=>a.id===d.id);
    state.appointments[idx] = rec;
  } else {
    state.appointments.push(rec);
  }
  await saveKey('appointments', state.appointments);
  closeModal();
}
async function deleteAppointment(id){
  state.appointments = state.appointments.filter(a=>a.id!==id);
  await saveKey('appointments', state.appointments);
  render();
}
async function toggleAppointmentStatus(id, status){
  const a = state.appointments.find(a=>a.id===id);
  if(a){ a.status = status; await saveKey('appointments', state.appointments); render(); }
}

async function submitTransactionForm(form, type){
  const rec = {
    id: uid(),
    type,
    amount: Number(form.amount.value)||0,
    description: form.description.value.trim(),
    category: form.category.value.trim() || 'General',
    date: todayISO()
  };
  state.transactions.push(rec);
  await saveKey('transactions', state.transactions);
  closeModal();
}
async function deleteTransaction(id){
  state.transactions = state.transactions.filter(t=>t.id!==id);
  await saveKey('transactions', state.transactions);
  render();
}

async function submitServiceForm(form){
  const d = state.modal.data;
  const rec = { id: d.id || uid(), name: form.name.value.trim(), price: Number(form.price.value)||0, duration: Number(form.duration.value)||30 };
  if(d.id){
    const idx = state.services.findIndex(s=>s.id===d.id);
    state.services[idx] = rec;
  } else {
    state.services.push(rec);
  }
  await saveKey('services', state.services);
  closeModal();
}
async function deleteService(id){
  state.services = state.services.filter(s=>s.id!==id);
  await saveKey('services', state.services);
  render();
}

/* ===================== RENDER ===================== */
function render(){
  const app = $('#app');
  app.innerHTML = `
    ${renderTopbar()}
    <div class="content">${renderTab()}</div>
    ${renderFab()}
    ${renderTabbar()}
    ${renderModal()}
  `;
  attachEvents();
  const chatBox = $('.chatlog');
  if(chatBox) chatBox.scrollTop = chatBox.scrollHeight;
}

function renderTopbar(){
  const titles = {asistente:'Asistente', agenda:'Agenda', cuentas:'Cuentas', servicios:'Servicios'};
  return `
  <div class="topbar">
    <div class="brand">
      <span class="mark">NAVA<span>JA</span></span>
    </div>
    <div class="pole"></div>
  </div>`;
}

function renderTab(){
  if(state.tab === 'asistente') return renderAsistente();
  if(state.tab === 'agenda') return renderAgenda();
  if(state.tab === 'cuentas') return renderCuentas();
  if(state.tab === 'servicios') return renderServicios();
  if(state.tab === 'ajustes') return renderAjustes();
  return '';
}

function renderAjustes(){
  const key = getApiKey();
  const masked = key ? key.slice(0,10) + '••••••••' : '';
  return `
  <h2 class="section-title">Ajustes</h2>
  <div class="card">
    <div class="field">
      <label>Llave de API de Anthropic</label>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." value="${escapeHtml(key)}">
    </div>
    <div class="small muted" style="margin-bottom:12px;line-height:1.5">
      Se guarda solo en este celular, nunca sale de aquí salvo para hablar con Claude.
      Consíguela gratis en <b>console.anthropic.com</b> → API Keys → Create Key. Solo pagas por lo que uses (unos centavos por conversación).
    </div>
    <button class="btn primary" id="saveKeyBtn" style="width:100%">Guardar llave</button>
    ${key ? `<div class="small" style="margin-top:10px;color:var(--gold)">Llave guardada: ${masked}</div>` : ''}
  </div>
  <div class="card">
    <div class="li-title" style="margin-bottom:6px">¿El micrófono no habla?</div>
    <div class="small muted" style="line-height:1.5">
      El micrófono solo funciona si esta app está en una dirección https:// (no si la abres como archivo descargado).
      Súbela gratis a GitHub Pages y ábrela desde ahí — pídeme los pasos si quieres que te guíe.
    </div>
  </div>
  `;
}

function renderAsistente(){
  const bubbles = state.chat.map(m => `<div class="bubble ${m.role}">${escapeHtml(m.text)}</div>`).join('');
  return `
  <div class="assist-wrap">
    <div class="mic-zone">
      <div class="mic-ring ${state.listening?'spin':''}"></div>
      <button class="mic-btn" id="micBtn" aria-label="Hablar">
        ${state.listening ? svgStop() : svgMic()}
      </button>
    </div>
    <div class="status-text">${state.listening ? 'Escuchando… toca para detener' : 'Toca el micrófono y habla'}</div>
    <div class="chatlog">${bubbles}</div>
    <form class="text-fallback" id="textForm">
      <input type="text" id="textInput" placeholder="O escribe aquí…" autocomplete="off">
      <button type="submit">Enviar</button>
    </form>
  </div>`;
}

function renderAgenda(){
  const list = [...state.appointments].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  if(list.length === 0){
    return `<h2 class="section-title">Agenda</h2>${emptyState('📅','No hay citas todavía','Agrégalas hablando con el asistente o con el botón +')}`;
  }
  const items = list.map(a => `
    <div class="list-item">
      <div class="li-left">
        <div class="li-title">${escapeHtml(a.client)} — ${escapeHtml(a.service||'')}</div>
        <div class="li-sub">${fmtDateLabel(a.date)} · ${a.time} · ${fmtMoney(a.price)}</div>
      </div>
      <div class="li-right">
        <span class="tag ${a.status==='completada'?'done': a.status==='cancelada'?'cancel':''}">${a.status}</span>
        <button class="icon-btn" data-edit-appt="${a.id}">✎</button>
        <button class="icon-btn" data-del-appt="${a.id}">✕</button>
      </div>
    </div>`).join('');
  return `<h2 class="section-title">Agenda</h2><div class="card">${items}</div>`;
}

function renderCuentas(){
  const balance = computeBalance(state.transactions);
  const income = state.transactions.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
  const expense = state.transactions.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  const list = [...state.transactions].sort((a,b)=> b.date.localeCompare(a.date) || 0).reverse().reverse();
  const sorted = [...state.transactions].sort((a,b)=> a.id < b.id ? 1 : -1);

  const items = sorted.length === 0 ? '' : sorted.map(t => `
    <div class="list-item">
      <div class="li-left">
        <div class="li-title">${escapeHtml(t.description || t.category)}</div>
        <div class="li-sub">${fmtDateLabel(t.date)} · ${escapeHtml(t.category)}</div>
      </div>
      <div class="li-right">
        <span class="amount ${t.type}">${t.type==='income'?'+':'−'} ${fmtMoney(t.amount)}</span>
        <button class="icon-btn" data-del-tx="${t.id}">✕</button>
      </div>
    </div>`).join('');

  return `
  <h2 class="section-title">Cuentas</h2>
  <div class="balance-card">
    <div class="balance-label">Balance actual</div>
    <div class="balance-value">${fmtMoney(balance)}</div>
    <div class="balance-row">
      <div class="balance-mini muted">Ingresos<b style="color:#c9d98a">${fmtMoney(income)}</b></div>
      <div class="balance-mini muted">Gastos<b style="color:var(--red)">${fmtMoney(expense)}</b></div>
    </div>
  </div>
  ${sorted.length===0 ? emptyState('💰','Sin movimientos','Registra un ingreso o gasto hablando o con el botón +') : `<div class="card">${items}</div>`}
  `;
}

function renderServicios(){
  if(state.services.length===0){
    return `<h2 class="section-title">Servicios</h2>${emptyState('✂️','Sin servicios','Agrega los servicios que ofreces y sus precios')}`;
  }
  const items = state.services.map(s => `
    <div class="list-item">
      <div class="li-left">
        <div class="li-title">${escapeHtml(s.name)}</div>
        <div class="li-sub">${s.duration} min</div>
      </div>
      <div class="li-right">
        <span class="amount">${fmtMoney(s.price)}</span>
        <button class="icon-btn" data-edit-svc="${s.id}">✎</button>
        <button class="icon-btn" data-del-svc="${s.id}">✕</button>
      </div>
    </div>`).join('');
  return `<h2 class="section-title">Servicios</h2><div class="card">${items}</div>`;
}

function emptyState(icon, title, sub){
  return `<div class="empty"><div class="big">${icon}</div><div style="font-weight:600;margin-bottom:4px">${title}</div><div class="small">${sub}</div></div>`;
}

function renderFab(){
  if(state.tab === 'asistente') return '';
  return `<button class="fab" id="fabBtn">+</button>`;
}

function renderTabbar(){
  const tabs = [
    {id:'asistente', label:'Asistente', icon: svgMicSmall()},
    {id:'agenda', label:'Agenda', icon: svgCalendar()},
    {id:'cuentas', label:'Cuentas', icon: svgCash()},
    {id:'servicios', label:'Servicios', icon: svgScissors()},
    {id:'ajustes', label:'Ajustes', icon: svgGear()},
  ];
  return `<div class="tabbar">
    ${tabs.map(t=>`<button class="tab-btn ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.icon}<span>${t.label}</span></button>`).join('')}
  </div>`;
}

function renderModal(){
  if(!state.modal) return `<div class="modal-backdrop hidden"></div>`;
  const {type, data} = state.modal;
  let body = '';
  if(type === 'appointment'){
    const opts = state.services.map(s=>`<option value="${escapeHtml(s.name)}" data-price="${s.price}" ${data.service===s.name?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
    body = `
    <h3>${data.id?'Editar cita':'Nueva cita'}</h3>
    <form id="apptForm">
      <div class="field"><label>Cliente</label><input name="client" value="${escapeHtml(data.client||'')}" required></div>
      <div class="field"><label>Servicio</label><select name="service" id="apptServiceSelect">${opts}</select></div>
      <div class="field"><label>Fecha</label><input type="date" name="date" value="${data.date||todayISO()}" required></div>
      <div class="field"><label>Hora</label><input type="time" name="time" value="${data.time||'10:00'}" required></div>
      <div class="field"><label>Precio</label><input type="number" name="price" id="apptPriceInput" value="${data.price|| (state.services[0]?state.services[0].price:0)}"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modalCancel">Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </div>
    </form>`;
  } else if(type === 'transaction'){
    body = `
    <h3>Nuevo movimiento</h3>
    <form id="txForm">
      <div class="field">
        <div class="seg" id="txTypeSeg">
          <button type="button" data-val="income" class="active">Ingreso</button>
          <button type="button" data-val="expense">Gasto</button>
        </div>
        <input type="hidden" name="type" value="income">
      </div>
      <div class="field"><label>Monto</label><input type="number" name="amount" required></div>
      <div class="field"><label>Descripción</label><input name="description" placeholder="Ej: corte de Juan"></div>
      <div class="field"><label>Categoría</label><input name="category" placeholder="Ej: servicios, insumos, renta"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modalCancel">Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </div>
    </form>`;
  } else if(type === 'service'){
    body = `
    <h3>${data.id?'Editar servicio':'Nuevo servicio'}</h3>
    <form id="svcForm">
      <div class="field"><label>Nombre</label><input name="name" value="${escapeHtml(data.name||'')}" required></div>
      <div class="field"><label>Precio</label><input type="number" name="price" value="${data.price||''}" required></div>
      <div class="field"><label>Duración (minutos)</label><input type="number" name="duration" value="${data.duration||30}"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modalCancel">Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </div>
    </form>`;
  }
  return `<div class="modal-backdrop"><div class="modal">${body}</div></div>`;
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---- icons ---- */
function svgMic(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`; }
function svgStop(){ return `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`; }
function svgMicSmall(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>`; }
function svgCalendar(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`; }
function svgCash(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>`; }
function svgScissors(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>`; }
function svgGear(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`; }

/* ===================== EVENTS ===================== */
function attachEvents(){
  const mic = $('#micBtn');
  if(mic) mic.addEventListener('click', toggleMic);

  const textForm = $('#textForm');
  if(textForm) textForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const input = $('#textInput');
    const val = input.value;
    input.value = '';
    askAssistant(val);
  });

  $$('.tab-btn').forEach(btn => btn.addEventListener('click', ()=>{
    state.tab = btn.dataset.tab;
    render();
  }));

  const fab = $('#fabBtn');
  if(fab) fab.addEventListener('click', ()=>{
    if(state.tab==='agenda') openModal('appointment', {});
    else if(state.tab==='cuentas') openModal('transaction', {});
    else if(state.tab==='servicios') openModal('service', {});
  });

  $$('[data-edit-appt]').forEach(b=>b.addEventListener('click', ()=>{
    const a = state.appointments.find(x=>x.id===b.dataset.editAppt);
    openModal('appointment', a);
  }));
  $$('[data-del-appt]').forEach(b=>b.addEventListener('click', ()=> deleteAppointment(b.dataset.delAppt)));

  $$('[data-del-tx]').forEach(b=>b.addEventListener('click', ()=> deleteTransaction(b.dataset.delTx)));

  $$('[data-edit-svc]').forEach(b=>b.addEventListener('click', ()=>{
    const s = state.services.find(x=>x.id===b.dataset.editSvc);
    openModal('service', s);
  }));
  $$('[data-del-svc]').forEach(b=>b.addEventListener('click', ()=> deleteService(b.dataset.delSvc)));

  const modalCancel = $('#modalCancel');
  if(modalCancel) modalCancel.addEventListener('click', closeModal);

  const apptForm = $('#apptForm');
  if(apptForm){
    apptForm.addEventListener('submit', (e)=>{ e.preventDefault(); submitAppointmentForm(apptForm); });
    const sel = $('#apptServiceSelect');
    if(sel) sel.addEventListener('change', ()=>{
      const price = sel.options[sel.selectedIndex].dataset.price;
      if(price) $('#apptPriceInput').value = price;
    });
  }

  const txForm = $('#txForm');
  if(txForm){
    let currentType = 'income';
    const seg = $('#txTypeSeg');
    seg.addEventListener('click', (e)=>{
      const b = e.target.closest('button');
      if(!b) return;
      currentType = b.dataset.val;
      $$('button', seg).forEach(x=>x.classList.toggle('active', x===b));
    });
    txForm.addEventListener('submit', (e)=>{ e.preventDefault(); submitTransactionForm(txForm, currentType); });
  }

  const svcForm = $('#svcForm');
  if(svcForm) svcForm.addEventListener('submit', (e)=>{ e.preventDefault(); submitServiceForm(svcForm); });

  const saveKeyBtn = $('#saveKeyBtn');
  if(saveKeyBtn) saveKeyBtn.addEventListener('click', ()=>{
    const val = $('#apiKeyInput').value.trim();
    setApiKey(val);
    render();
  });

  const backdrop = $('.modal-backdrop');
  if(backdrop) backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });
}

/* ===================== INIT ===================== */
if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged = () => {};
}
bootstrap();
</script>
</body>
</html>
